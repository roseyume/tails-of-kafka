tasks:
  - name: Setup Kafka Environment
    command: |
      gp open README.md
      export PUBLIC_IP=127.0.0.1
      docker-compose up -d
      pip install -r requirements.txt
      python -m streamlit run workshop/kafka_dashboard.py
  
env:
  KAFKAJS_NO_PARTITIONER_WARNING: "1"

ports:
  # Kafka Brokers, Zookeeper 
  - port: 2188
    onOpen: ignore
  - port: 9092
    onOpen: ignore
  - port: 9093
    onOpen: ignore
  - port: 9094
    onOpen: ignore
  - port: 2181
    onOpen: ignore
  - port: 9992
    onOpen: ignore
  - port: 9993
    onOpen: ignore
  - port: 9994
    onOpen: ignore

  # Kafka Schema Registry 
  - port: 8081
    onOpen: ignore

  - port: 8501
    onOpen: open-browser



vscode:
  extensions:
    - ms-azuretools.vscode-docker    