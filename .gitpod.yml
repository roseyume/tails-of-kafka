tasks:
  - name: Setup Kafka Environment
    command: |
      gp open README.md
      export PUBLIC_IP=127.0.0.1
      docker-compose up -d
      pip install -r requirements.txt
      uvicorn backend.main:app --reload --port 8000 --host 0.0.0.0
      npm install axios react-bootstrap bootstrap vite
      cd frontend
      npm start
      gp ports visibility 8000:public
      gp ports visibility 3000:public
  
env:
  KAFKAJS_NO_PARTITIONER_WARNING: "1"
  REACT_APP_BACKEND_URL: https://8000-<workspace-id>.ws-us121.gitpod.io #TODO: Validate this and Update apiUrl variable

ports:
  # Kafka Brokers, Zookeeper 
  - port: 2188
    onOpen: ignore
  - port: 9092
    onOpen: ignore
  - port: 9093
    onOpen: ignore
  - port: 9094
    onOpen: ignore
  - port: 2181
    onOpen: ignore
  - port: 9992
    onOpen: ignore
  - port: 9993
    onOpen: ignore
  - port: 9994
    onOpen: ignore

  # Kafka Schema Registry 
  - port: 8081
    onOpen: ignore

  - port: 8000
    visibility: public
    onOpen: ignore
  - port: 3000
    visibility: public
    # onOpen: open-preview




vscode:
  extensions:
    - ms-azuretools.vscode-docker    